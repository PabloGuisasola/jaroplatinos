<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JaroPlatinos — Chat en vivo</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .chat-page { display: flex; flex-direction: column; height: calc(100vh - 60px); }
    .chat-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .chat-header h1 { font-size: 1.1rem; font-weight: 700; }
    .chat-header p { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .online-badge {
      font-size: 0.75rem;
      padding: 3px 10px;
      background: rgba(61,184,112,0.1);
      color: var(--success);
      border-radius: 20px;
      font-weight: 600;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-item { display: flex; gap: 10px; }
    .msg-item.own { flex-direction: row-reverse; }
    .msg-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--psn-blue);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 0.75rem;
    }
    .msg-item.own .msg-avatar { background: var(--surface2); color: var(--text-muted); }
    .msg-bubble {
      max-width: 70%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 0.88rem;
    }
    .msg-item.own .msg-bubble {
      background: var(--psn-blue);
      border-color: var(--psn-blue);
      color: #fff;
    }
    .msg-username { font-size: 0.75rem; font-weight: 700; color: var(--psn-blue-glow); margin-bottom: 3px; }
    .msg-item.own .msg-username { color: rgba(255,255,255,0.8); }
    .msg-text { line-height: 1.4; word-break: break-word; }
    .msg-time { font-size: 0.7rem; color: var(--text-faint); margin-top: 3px; }
    .msg-item.own .msg-time { color: rgba(255,255,255,0.55); }
    .chat-input-area {
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      background: var(--bg);
    }
    .chat-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .chat-input:focus { border-color: var(--psn-blue); }
    .chat-input::placeholder { color: var(--text-faint); }
    .chat-send-btn {
      padding: 10px 18px;
      background: var(--psn-blue);
      border: none; border-radius: 10px;
      color: #fff; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; transition: background 0.15s;
      flex-shrink: 0;
    }
    .chat-send-btn:hover { background: var(--psn-blue-glow); }
    .chat-login-overlay {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 1rem; text-align: center; padding: 2rem;
    }
    .chat-login-overlay p { color: var(--text-muted); }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo">Jaro<span>Platinos</span></a>
    <div class="nav-links">
      <a href="../index.html">← Catálogo</a>
      <span id="nav-user" style="font-size:0.85rem;color:var(--text-muted)"></span>
    </div>
  </nav>

  <div class="chat-page">
    <div class="chat-header">
      <div>
        <h1>Chat de la comunidad</h1>
        <p>Habla con otros cazadores de platinos en tiempo real</p>
      </div>
      <span class="online-badge" id="online-count">🟢 En línea</span>
    </div>

    <div id="chat-body">
      <div class="chat-login-overlay" id="login-overlay" style="display:none">
        <span style="font-size:2.5rem">💬</span>
        <p>Inicia sesión para participar en el chat en vivo.</p>
        <a href="login.html" class="cta-btn">Iniciar sesión</a>
      </div>

      <div class="chat-messages" id="chat-messages"></div>
    </div>

    <div class="chat-input-area" id="input-area">
      <input class="chat-input" id="msg-input" placeholder="Escribe un mensaje..." maxlength="300" autocomplete="off">
      <button class="chat-send-btn" id="btn-send">Enviar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ==========================================
    // 🔗 CONEXIÓN A TU BASE DE DATOS SUPABASE
    // ==========================================
    const SUPABASE_URL = 'https://bknzpvnsfanrxzapsute.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_5r9XUEbSkUbhidKqS8nBew_VDIuupr1';
    
    // 🛑 CAMBIO CLAVE: Usamos 'dbCliente' en lugar de 'supabase' para que no choque
    const dbCliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let mensajesGlobales = [];

    // Comprobar usuario guardado en el navegador
    function getUser() { return JSON.parse(localStorage.getItem('jp_user') || 'null'); }
    
    const user = getUser();
    const navUser = document.getElementById('nav-user');
    if (user) navUser.textContent = user.username;

    // Si no está logueado, bloquear chat
    if (!user) {
      document.getElementById('login-overlay').style.display = 'flex';
      document.getElementById('chat-messages').style.display = 'none';
      document.getElementById('input-area').style.display = 'none';
    }

    // 🎨 RENDERIZAR MENSAJES
    function renderMessages() {
      const container = document.getElementById('chat-messages');
      if (!container) return;

      container.innerHTML = mensajesGlobales.map(m => {
        const isOwn = user && m.username === user.username;
        const date = new Date(m.created_at);
        const timeString = date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

        return `
          <div class="msg-item${isOwn ? ' own' : ''}">
            <div class="msg-avatar">${m.username.slice(0,2).toUpperCase()}</div>
            <div class="msg-bubble">
              ${!isOwn ? `<div class="msg-username">${escapeHTML(m.username)}</div>` : ''}
              <div class="msg-text">${escapeHTML(m.text)}</div>
              <div class="msg-time">${timeString}</div>
            </div>
          </div>
        `;
      }).join('');

      // Hacer scroll automático al final
      container.scrollTop = container.scrollHeight;
    }

    // 📥 DESCARGAR HISTORIAL
    async function cargarMensajes() {
      const { data, error } = await dbCliente
        .from('mensajes')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(100);

      if (error) {
        console.error("Error al cargar:", error);
      } else {
        mensajesGlobales = data;
        renderMessages();
      }
    }

    // 📤 ENVIAR NUEVO MENSAJE
    async function sendMessage() {
      if (!user) return;
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = ''; 

      // Guardamos en Supabase
      const { error } = await dbCliente
        .from('mensajes')
        .insert([{ username: user.username, text: text }]);

      if (error) console.error("Error al enviar:", error);
    }

    // Protección anti inyecciones HTML
    function escapeHTML(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Eventos
    const btnSend = document.getElementById('btn-send');
    const msgInput = document.getElementById('msg-input');
    
    if (btnSend) btnSend.addEventListener('click', sendMessage);
    if (msgInput) msgInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // ⚡ LA MAGIA: SUSCRIPCIÓN EN TIEMPO REAL
    if (user) {
      cargarMensajes(); 

      // Escuchar cambios en vivo
      dbCliente
        .channel('chat-publico')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, payload => {
          mensajesGlobales.push(payload.new); 
          renderMessages(); 
        })
        .subscribe();
    }
  </script>
</body>
</html>
