<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JaroPlatinos — Guías de platino sin spoilers</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <nav class="navbar">
  <a href="index.html" class="logo">Jaro<span>Platinos</span></a>
  <div class="nav-links">
    <a href="#catalogo">Catálogo</a>
    <a href="pages/library.html">Biblioteca</a>
    <a href="pages/login.html" class="btn-psn" id="nav-login-btn">Iniciar sesión</a>
  </div>
</nav>

  <header class="hero">
  <div class="hero-content">
    <div class="hero-badge">Guías sin spoilers</div>
    <h1>Consigue el platino.<br>A tu ritmo.</h1>
    <p>Trofeos perdibles marcados capítulo a capítulo. Sin revelar lo que no necesitas saber todavía.</p>
    <a href="#catalogo" class="cta-btn">Ver catálogo</a>
  </div>

  <a href="https://www.youtube.com/@Jaro0016" target="_blank" class="hero-logo-link">
    <img src="img/logo-modified.png" alt="Canal de Jaro" class="hero-avatar">
  </a>
</header>

  <main class="container" id="catalogo">
    <div class="section-header">
      <h2>Catálogo de juegos</h2>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="ps5">PS5</button>
        <button class="filter-btn" data-filter="ps4">PS4</button>
        <button class="filter-btn" data-filter="missable">Con perdibles</button>
      </div>
    </div>

    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search-input" placeholder="Buscar juego..." autocomplete="off">
    </div>

    <div class="games-grid" id="games-grid">
      </div>
  </main>

  <footer class="footer">
    <p>Jaro0016 · Proyecto personal · <a href="https://www.youtube.com/@Jaro0016" target="_blank">YouTube</a></p>
  </footer>

  <script src="js/games-data.js"></script>
  <script src="js/catalog.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const navLoginBtn = document.getElementById('nav-login-btn');
      const user = JSON.parse(localStorage.getItem('jp_user'));
      if (user && navLoginBtn) {
        navLoginBtn.innerHTML = `<span>${user.username}</span>`;
        navLoginBtn.style.background = 'transparent';
        navLoginBtn.style.border = '1px solid var(--border)';
      }
    });
  </script>
</body>
</html>
